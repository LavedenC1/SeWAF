<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied | SeWAF</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 520px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: #dc2626;
      color: #fff;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .shield-icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 4px;
    }

    .content {
      padding: 32px;
    }

    .message {
      color: #374151;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .reference {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 16px;
    }

    .reference h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .reference-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    .reference-item:last-child {
      border-bottom: none;
    }

    .reference-label {
      color: #6b7280;
    }

    .reference-value {
      color: #111827;
      font-family: 'SF Mono', Monaco, 'Courier New', monospace;
      font-size: 13px;
    }

    .footer {
      padding: 16px 32px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
    }

    .footer p {
      font-size: 12px;
      color: #9ca3af;
    }

    .footer a {
      color: #6b7280;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div>
        <h1>Access Denied</h1>
        <p>Request blocked by SeWAF</p>
      </div>
    </div>
    
    <div class="content">
      <p class="message">
        Your request has been blocked by our Web Application Firewall. This action was taken to protect the server from potentially malicious activity.
      </p>
      
      <div class="reference">
        <h3>Reference Information</h3>
        <div class="reference-item">
          <span class="reference-label">Your IP</span>
          <span class="reference-value" id="client-ip">Loading...</span>
        </div>
        <div class="reference-item">
          <span class="reference-label">Timestamp</span>
          <span class="reference-value" id="timestamp">Loading...</span>
        </div>
      </div>
    </div>
    
    <div class="footer">
      <p>Protected by <strong>SeWAF</strong></p>
    </div>
  </div>

  <script>
    // Set timestamp
    const now = new Date();
    document.getElementById('timestamp').textContent = now.toISOString();

    // Fetch IP from external source
    fetch('https://api.ipify.org?format=json')
      .then(response => response.json())
      .then(data => {
        document.getElementById('client-ip').textContent = data.ip;
      })
      .catch(() => {
        document.getElementById('client-ip').textContent = 'Unavailable';
      });
  </script>
</body>
</html>
