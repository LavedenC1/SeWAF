<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vulnerable App Frontend</title>
    <style>body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:2rem}</style>
  </head>
  <body>
    <h1>Acme Web Portal</h1>
    <ul>
      <li><a href="/search?q=example" target="_blank">Search</a></li>
      <li><a href="/signin?username=bob&password=bob123" target="_blank">Sign in</a></li>
      <li><a href="/download?name=about.txt" target="_blank">Documents</a></li>
      <li><a href="/mirror?msg=hello" target="_blank">Messages</a></li>
      <li><a href="/upload" target="_blank">Upload</a></li>
      <li><a href="/proxy?url=http://example.com" target="_blank">External Fetch</a></li>
      <li><a href="/auth/session" target="_blank">Create Session</a> — then visit <a href="/admin" target="_blank">/admin</a></li>
    </ul>

    <h2>Tools</h2>
    <form action="/proxy" method="get" target="_blank">
      <label>Fetch URL: <input name="url" size="60" value="http://example.com"></label>
      <button type="submit">Fetch</button>
    </form>

    <form action="/search" method="get" target="_blank">
      <label>Search: <input name="q" size="60" value="example"></label>
      <button type="submit">Search</button>
    </form>
  </body>
</html>
